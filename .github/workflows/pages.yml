name: Deploy KDA explainer to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate lesson computations
        run: |
          node --check course.js
          node --check course-math.js
          node --check course-foundations.js
          node tests/course-math.test.cjs
      - name: Prepare website artifact
        run: |
          mkdir -p _site
          cp index.html lab.html style.css app.js course.html course.css course.js course-math.js course-foundations.js mc2-study.html kda-pr970.html _site/
          touch _site/.nojekyll
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

